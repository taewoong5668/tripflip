<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <title>트립플립</title>
  <!-- 지인 전용: 검색엔진(구글 등)에 나오지 않게 -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  <!-- 홈 화면에 추가했을 때 앱처럼 (아이콘, 주소창 없음) -->
  <link rel="manifest" href="manifest.webmanifest?v=202610202115">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="트립플립">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="lib/leaflet/leaflet.css?v=202610202115">
  <link rel="stylesheet" href="style.css?v=202610202115">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn back" id="btnBack" data-act="toList" aria-label="시간표로" hidden>
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="head-text" data-act="calendar">
      <div class="trip" id="tripTitle">내 여행</div>
      <div class="day" id="dayTitle"></div>
    </div>
    <button class="icon-btn" data-act="calendar" aria-label="달력">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    </button>
    <button class="icon-btn accent" id="btnView" data-act="toggleView" aria-label="하루 전체 지도">
      <svg viewBox="0 0 24 24" id="iconMap"><path d="M9 4L3.5 6v14L9 18l6 2 5.5-2V4L15 6 9 4z"/><path d="M9 4v14M15 6v14"/></svg>
      <svg viewBox="0 0 24 24" id="iconList" hidden><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
    </button>
    <button class="icon-btn" data-act="settings" aria-label="설정">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
    <input type="file" id="fileInput" accept=".csv,.xlsx,.xls,text/csv" hidden>
  </header>
  <nav id="dayTabs" class="day-tabs" hidden></nav>

  <div class="stage">
    <main id="listView" class="layer list-view active">
      <div id="dayPage" class="day-page">
        <section id="status" class="status" hidden></section>
        <section id="timeline" class="timeline"></section>
      </div>
    </main>

    <section id="detailView" class="layer detail-view" aria-hidden="true"></section>

    <section id="mapView" class="layer map-view" aria-hidden="true">
      <div id="map" class="map"></div>
      <div id="mapStatus" class="map-status" hidden></div>
      <button id="btnLocate" class="fab" aria-label="내 위치">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
      <div id="carousel" class="carousel"></div>
    </section>
  </div>

  <div id="sheet" class="sheet" hidden></div>
  <div id="viewer" class="viewer" hidden></div>
  <input type="file" id="attachInput" accept="image/*,application/pdf,.pdf" multiple hidden>
  <div id="alarm" class="alarm" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script src="lib/xlsx.full.min.js?v=202610202115"></script>
  <script src="lib/leaflet/leaflet.js?v=202610202115"></script>
  <script type="module" src="js/app.js?v=202610202115"></script>
</body>
</html>
